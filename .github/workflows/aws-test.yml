name: AWS Login Test
on: workflow_dispatch
 
jobs:
    whoami:
        runs-on: ubuntu-latest
        environment: production 
        permissions: 
            id-token: write
            contents: read
        steps:
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{vars.AWS_ROLE_ARN}}
                aws-region: ${{vars.AWS_REGION}}
            - run: aws sts get-caller-identity 